############ MAT_VIZ 실행 설정 (코드 기반 주석) ############
# 확인 기준 코드:
# - mat_viz.py: 체크포인트/출력 경로/런타임 옵션
# - mid.py + models/autoencoder.py + models/diffusion.py: 예측/가이던스/시각화
# - utils/trajectron_hypers.py: Trajectron 하이퍼파라미터(특히 시간축)
# 주의: 아래 키 중 일부는 현재 main.py/mat_viz.py -> MID 경로에서 실제로 읽히지 않습니다.

# 사용할 데이터셋 이름.
# mat_viz.py에서 비워두면 체크포인트 이름(<dataset>_epochN.pt)에서 자동 추론.
dataset: "mat_collision"


viz_ckpt_dir: mat_run/network # 체크포인트 폴더.
viz_ckpt_name: "mat_collision_epoch200.pt" # 로드할 체크포인트 파일명(파일명만 허용, 경로 포함 금지).
viz_output_dir: mat_run # mat_run.py 결과 루트 폴더.
viz_seed: 0 # mat_viz 샘플 선택/시각화 재현 시드.
viz_epoch_tag: null # 출력 epoch 태그 강제 지정(정수 또는 null). null이면 ckpt epoch 사용.

standardization_path: mat_preprocess/processed_data/standardization_collision.yaml # generation에서 사용할 평균/표준편차 YAML.
generation_device: cuda # cuda, cpu, auto

car_width: 1.825 # 차량 박스 폭(m): 시각화 박스/겹침 판단에 사용.
car_length: 4.650 # 차량 박스 길이(m): 시각화 박스/겹침 판단에 사용.

# [현재 run.yaml 값 미반영] 시간축은 utils/trajectron_hypers.py가 configs/train.yaml에서 읽습니다.
# 즉, 아래 3개는 현재 main/mat_viz 경로에서 계산에 직접 사용되지 않습니다.
data_dt: 0.02
history_sec: 0.6
prediction_sec: 0.9


viz_num_examples: 1 # 한 번의 시각화 실행에서 출력할 장면 수
viz_num_samples: 5 # 장면당 생성 샘플 
viz_predict_agents: 1 # 예측 대상 선택: 1=Target만 생성(Ego 고정), 2=Ego+Target 생성.

viz_vehicle_boxes_enabled: True # 차량 박스 렌더링 on/off.
viz_vehicle_box_center_enabled: True # 박스 중심점 강조 표시 on/off.
viz_vehicle_box_yaw_arrow_enabled: True # yaw 화살표 표시 on/off.
viz_vehicle_box_yaw_arrow_scale: 0.2 # yaw 화살표 길이 스케일.

############ 학습/평가 기본 파라미터 ############
# Adam learning rate(mid.py _build_optimizer).
lr: 0.001
# 학습 시 gradient clip 값(mid.py train).
grad_clip: 1.0
# 데이터셋 pkl 폴더(mid.py: <data_dir>/<dataset>_train/test.pkl).
data_dir: mat_preprocess/processed_data
# Diffusion 네트워크 클래스명(models/diffusion.py 내 클래스명과 매칭).
diffnet: TransformerConcatLinear
# 인코더 차원(및 일부 hyperparam 차원 계산에 사용).
encoder_dim: 256
# Transformer layer 수(diffusion 네트워크 생성 시 사용).
tf_layer: 3
# 학습 epoch 수(main.py에서 eval_mode=False일 때만 의미 있음).
epochs: 500
# 학습 배치 크기.
batch_size: 256
# 평가/시각화 배치 크기.
eval_batch_size: 256
# [현재 run.yaml 값 미반영] k_eval은 get_traj_hypers() 기본값(25)을 사용합니다.
k_eval: 25
# [mat_viz에서 fallback 용도] viz_seed가 없을 때만 seed를 참조.
seed: 123
# 학습 중 주기 평가 간격(mid.py train).
eval_every: 0

# 평가할 체크포인트 epoch(main.py eval_mode=True일 때 사용).
# mat_viz.py에서는 선택한 ckpt의 epoch로 자동 덮어씁니다.
eval_at: 100
# 평가 모드 여부(main.py).
# mat_viz.py에서는 항상 True로 덮어씁니다.
eval_mode: True
# 샘플링 방식(ddpm 또는 ddim).
sampling: ddpm

############ 동역학 가이던스 (J_dyn) ############
# Bicycle model 기반 동역학 가이던스.
# 속도 시퀀스를 kinematic bicycle 관계식에 맞게 부드럽게 유도합니다.
dynamics_guidance_enabled: True
dynamics_guidance_scale: 0.015
dynamics_guidance_inner_steps: 1
dynamics_guidance_max_grad_norm: 20.0
dynamics_guidance_eps: 1.0e-6

# Bicycle model 핵심 파라미터.
dynamics_guidance_min_speed: 0.05
dynamics_guidance_wheelbase: 2.70
dynamics_guidance_max_steer_deg: 32.0
dynamics_guidance_max_steer_rate_deg_s: 120.0
dynamics_guidance_max_accel: 6.0

# J_dyn = accel + steer angle + steer rate + low-speed anti-spin
dynamics_guidance_weight_accel: 0.20
dynamics_guidance_weight_steer: 0.80
dynamics_guidance_weight_steer_rate: 0.20
dynamics_guidance_low_speed_yaw_weight: 0.30
dynamics_guidance_low_speed_yaw_threshold: 0.3

############ MAT yaw 방향 가이던스 ############
# MAT에 들어있는 yaw를 기준으로, 정지/저속 Target의 생성 velocity 방향을 맞춥니다.
heading_guidance_enabled: True
heading_guidance_stationary_only: True
heading_guidance_stationary_speed: 0.30
heading_guidance_stationary_displacement: 0.35
heading_guidance_weight: 3.0
heading_guidance_min_speed: 0.03
heading_guidance_focus_ratio: 1.0

############ SafeSim collision + local non-collision 가이던스 ############
# 둘 중 하나만 켜세요. not_collision이 켜지면 collision은 내부에서 자동 비활성됩니다.
collision_guidance_enabled: True
not_collision_guidance_enabled: False

# collision=True일 때만 사용: SafeSim 공식 guidance_config.py의 params/ttc/causecollision 이름을 유지합니다.
safesim_guidance:
  params:
    inner_lr: 0.2
    n_guide_steps: 4
    # 로컬 adapter: 여러 샘플 중 objective가 가장 좋은 샘플을 sample=1로 재정렬.
    sample_filter_enabled: True
  ttc:
    # SafeSim 공식 이름: time_bandwidth, distance_bandwidth, min_velocity_diff.
    time_bandwidth: 1.0
    distance_bandwidth: 1.0
    min_velocity_diff: 0.1
    loss_timesteps: null
    filter_timesteps: null
    loss_scale: 3.0
    mode: ego_target
  causecollision:
    # SafeSim 공식 causecollision 파라미터 이름.
    prediction_mode: ego_plan
    loss_timesteps: null
    filter_timesteps: null
    loss_scale: 30.0
    adv_term_weight:
      distance: 1.0
      speed_penalty: 0.0
      filtered_distance: 0.5
    interact_mode: distance
    adv_bound: 30.0
    speed_diff: 2.0
    interact_dist_thresh: 100.0

# non-collision=True일 때만 사용: SafeSim 공식 항이 아닌 로컬 확장 repel objective입니다.
local_noncollision:
  safe_distance: 12.0
  loss_timesteps: null
  filter_timesteps: null
  loss_scale: 10.0

# 초기 x_T 노이즈 온도(샘플 다양성에 영향).
sampling_xt_temperature: 1.0
# diffusion sigma flexibility(mid.py -> diffusion.sample flexibility).
viz_sampling_flexibility: 0.0

############ 학습 보조 손실 (Yaw) ############
# yaw 보조 손실 사용 여부(models/autoencoder.py get_loss).
yaw_loss_enabled: True
# yaw 보조 손실 가중치.
yaw_loss_weight: 0.1
# yaw 보조 손실에서 이동 마스크 최소 속도.
yaw_loss_min_speed: 0.5
# yaw 보조 손실 수치 안정성 epsilon.
yaw_loss_speed_eps: 1.0e-6

############ Bicycle Rollout 투영 (생성 후처리) ############
# 생성 velocity를 위 bicycle 파라미터로 한번 더 투영할지 여부.
bicycle_rollout_enabled: True

############### Trajectron++ 호환 키 ############
# 아래 키는 원래 Trajectron CLI와의 호환 목적이 섞여 있습니다.
# 현재 코드 경로에서 실제 반영 여부를 각 주석에 명시합니다.

# [현재 미사용] main.py/mat_viz.py -> MID 경로에서 읽지 않음.
conf: None
# [현재 미사용] debug 플래그를 참조하는 분기 없음.
debug: False
# 데이터 로더 worker 수(mid.py train/eval dataloader).
preprocess_workers: 0

# [현재 run.yaml 값 미반영] get_traj_hypers() 고정값을 사용.
# 또한 mid.py에서는 _build_offline_scene_graph() 호출이 주석 처리되어 실제 계산도 수행하지 않음.
offline_scene_graph: yes
# [현재 run.yaml 값 미반영] get_traj_hypers() 고정값 사용.
dynamic_edges: yes
# [현재 run.yaml 값 미반영] get_traj_hypers() 고정값 사용.
edge_state_combine_method: sum
# [현재 run.yaml 값 미반영] get_traj_hypers() 고정값 사용.
edge_influence_combine_method: attention
# [현재 run.yaml 값 미반영] get_traj_hypers() 고정값 사용.
edge_addition_filter: [0.25, 0.5, 0.75, 1.0]
# [현재 run.yaml 값 미반영] get_traj_hypers() 고정값 사용.
edge_removal_filter: [1.0, 0.0]

# attention radius 수동 오버라이드(mid.py train/eval loader에서 사용).
override_attention_radius: []
# robot node 포함 여부(mid.py dataset 구성 시 return_robot 계산에 사용).
incl_robot_node: False
# [현재 run.yaml 값 미반영] map_encoding은 get_traj_hypers() 고정값 사용.
map_encoding: False
# 학습 데이터 증강 on/off(mid.py train 루프에서 train_dataset.augment에 반영).
augment: False
# [현재 run.yaml 값 미반영] node_freq_mult_*는 get_traj_hypers() 고정값 사용.
node_freq_mult_train: False
# [현재 run.yaml 값 미반영] node_freq_mult_*는 get_traj_hypers() 고정값 사용.
node_freq_mult_eval: False
# 부분 반영: mid.py에서 scene 샘플링 확률 선택에 사용.
# 단, EnvironmentDataset 생성 파라미터는 get_traj_hypers() 값을 사용.
scene_freq_mult_train: False
# 부분 반영: mid.py에서 scene 샘플링 확률 선택에 사용.
# 단, EnvironmentDataset 생성 파라미터는 get_traj_hypers() 값을 사용.
scene_freq_mult_eval: False
# [현재 미사용] scene_freq_mult_viz를 참조하는 코드 경로 없음.
scene_freq_mult_viz: False
# [현재 run.yaml 값 미반영] no_edge_encoding은 get_traj_hypers() 고정값 사용.
no_edge_encoding: False

# [현재 미사용] config.device를 참조하는 코드 경로 없음(cuda 하드코딩 경로 사용).
device: cuda
# [현재 미사용] config.eval_device를 참조하는 코드 경로 없음.
eval_device: None
